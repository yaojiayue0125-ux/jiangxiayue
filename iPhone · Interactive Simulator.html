<section class="screen appview wx hidden" id="appview"><div class="appbar"><button class="back" id="back">‹ 返回</button><div class="apptitle" id="apptitle">信息</div></div><div id="appcontent"></div></section>

<script>
const PASS='0125';const $=s=>document.querySelector(s);let current='lock',pin='',activeApp='',liked=false;
function show(id){['lock','passcode','home','appview'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));current=id;$('#island').classList.toggle('pc',id==='passcode');$('#phone').classList.toggle('wxmode',id==='appview')}
function updateTime(){let d=new Date();let t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#clock').textContent=t;$('#bigtime').textContent=t;$('#date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
updateTime();setInterval(updateTime,15000);
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
$('#lock').addEventListener('click',()=>show('passcode'));$('#lock').addEventListener('touchstart',()=>{}, {passive:true});
const keypad=$('#keypad');[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['0','']].forEach(([k,l])=>{let b=document.createElement('button');b.className='key'+(k==='0'?' zero':'');b.innerHTML=k+(l?'<small>'+l+'</small>':'');b.onclick=()=>{if(pin.length<4){pin+=k;renderDots();if(pin.length===4){if(pin===PASS){pin='';show('home');renderDots();toast('欢迎回来')}else{toast('密码错误，请重试');pin='';setTimeout(renderDots,150)}}}};keypad.appendChild(b)});
function renderDots(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('filled',i<pin.length));$('#cancel').textContent=pin.length?'Delete':'Cancel'}
$('#cancel').onclick=()=>{if(pin){pin=pin.slice(0,-1);renderDots()}else show('lock')};
$('#homebar').onclick=()=>{if(current==='lock'){show('passcode')}else if(current==='passcode'){show('lock')}else show('home')};
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function openApp(name){activeApp=name;if(name==='微信'){show('appview');wxOpen();return}$('#apptitle').textContent=name;show('appview');const c=$('#appcontent');c.innerHTML='';
const panel=(inner)=>{let d=document.createElement('div');d.className='panel';d.innerHTML=inner;c.appendChild(d)};
const row=(icon,title,sub='')=>`<div class="rowitem"><div class="avatar">${icon}</div><div class="grow"><strong>${title}</strong><div class="muted">${sub}</div></div><span style="color:#bbb">›</span></div>`;
if(name==='信息'||name==='微信'){panel(`<input class="searchinput" placeholder="搜索"><div>${row('🌿','妈妈','到家告诉我一声。')}${row('🐰','特别关注','刚刚发来一条消息')}${row('💬','舞社群聊','周末排练时间确认一下')}${row('✨','置顶聊天','今天过得怎么样？')}</div><button class="bluebtn" onclick="toast('新建对话已打开')">＋ 新建信息</button>`)}
else if(name==='电话'){panel(`<div style="font-size:32px;text-align:center;padding:18px">个人收藏</div>${row('👩','妈妈','移动电话')}${row('🌼','舞社','最近通话 · 今天')}`);panel(`<div style="font-size:14px;margin-bottom:12px">拨号键盘</div><div class="calc" id="dial"></div><div id="dialnum" style="text-align:center;font-size:24px;margin:12px"></div><button class="bluebtn" onclick="toast('模拟拨号中…')">呼叫</button>`);let d=$('#dial');'123456789*0#'.split('').forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>$('#dialnum').textContent+ n;d.appendChild(b)})}
else if(name==='相机'){panel(`<div style="height:340px;border-radius:16px;background:linear-gradient(135deg,#171b1e,#525a60);display:grid;place-items:center;color:#ddd;font-size:14px">相机模拟预览</div><div style="display:flex;justify-content:center;padding:20px"><button class="circlebtn" style="background:white;color:#333;width:60px;height:60px" onclick="toast('咔嚓！照片已拍摄')">●</button></div>`)}
else if(name==='备忘录'){panel(`<input class="searchinput" placeholder="标题"><textarea class="notearea" placeholder="开始记录你的想法……"></textarea><button class="bluebtn" onclick="toast('备忘录已保存')">完成</button>`)}
else if(name==='计算器'){panel(`<div class="calcresult" id="calcresult">0</div><div class="calc" id="calculator"></div>`);let expr='';['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''].filter(Boolean).forEach(n=>{let b=document.createElement('button');b.textContent=n;if(['÷','×','−','+','='].includes(n))b.className='op';b.onclick=()=>{let r=$('#calcresult');if(n==='AC'){expr='';r.textContent='0'}else if(n==='='){try{r.textContent=String(Function('return '+expr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))());expr=r.textContent}catch{r.textContent='错误';expr=''}}else{expr+=({'×':'*','÷':'/','−':'-'}[n]||n);r.textContent=expr}};$('#calculator').appendChild(b)})}
else if(name==='设置'){panel(`${row('✈️','飞行模式','关闭')}${row('◉','Wi-Fi','已连接')}${row('▰','蓝牙','已打开')}${row('🌿','墙纸','绿色渐变')}${row('🔒','密码','已设置')}`);panel(`<div class="settingsrow">深色模式 <input class="switch" type="checkbox" onchange="document.body.style.background=this.checked?'#050505':'#101411'"></div><div class="settingsrow">电量百分比 <span>74%</span></div>`)}
else if(name==='Safari'){panel(`<input class="searchinput" id="webq" placeholder="搜索或输入网站名称"><button class="bluebtn" onclick="let q=$('#webq').value;toast(q?'模拟打开：'+q:'请输入网址')">前往</button>`);panel(`<strong>个人收藏</strong>${row('🔎','搜索','搜索网页')}${row('🌐','常用网站','你收藏的网站会显示在这里')}`)}
else if(name==='QQ音乐'){panel(`<div style="text-align:center;padding:20px"><div style="font-size:65px">♫</div><h2>好天气</h2><div class="muted">韦礼安</div><input type="range" min="0" max="100" value="35" style="width:100%;margin:25px 0"><div style="font-size:25px;display:flex;justify-content:center;gap:35px"><span onclick="toast('上一首')">⏮</span><span onclick="toast('播放状态已切换')">▶︎ / Ⅱ</span><span onclick="toast('下一首')">⏭</span></div></div>`)}
else if(name==='小红书'||name==='微博'||name==='Instagram'||name==='X'){panel(`<input class="searchinput" placeholder="搜索"><h3>${name==='小红书'?'发现生活里的美好':name==='微博'?'微博热搜':'为你推荐'}</h3>${row('🌱','今日份绿色','把平凡的日子过得闪闪发光。')}${row('📸','夏日记录','收藏一点好天气。')}${row('🎧','最近在听','循环播放的歌和心情。')}<button class="bluebtn" onclick="toast('已刷新内容')">刷新动态</button>`)}
else if(name==='T-FAMILY'){panel(`<div style="text-align:center;padding:25px"><div style="font-size:55px;color:#f2a51b;font-weight:900">TF</div><h2>T-FAMILY</h2><p class="muted">记录喜欢的舞台与日常</p></div>${row('🎤','最新动态','查看关注的艺人')}${row('📷','相册','收藏的照片')}</div>`)}
else if(name==='钉钉'){panel(`${row('📌','工作通知','暂无未读通知')}${row('🗓️','日程','今天没有安排')}`)}
else{panel(`<div style="text-align:center;padding:25px"><div style="font-size:50px">📱</div><h2>${name}</h2><p class="muted">这是一个可交互的模拟 App 页面。</p><button class="bluebtn" onclick="toast('操作成功')">打开功能</button></div>`)}
}
$('#back').onclick=()=>show('home');
document.addEventListener('keydown',e=>{if(current==='passcode'&&/^\d$/.test(e.key)&&pin.length<4){pin+=e.key;if(pin.length===4){if(pin===PASS){show('home');pin=''}else{toast('密码错误');pin=''}}renderDots()}if(e.key==='Escape')show('home')});
let sy=0;$('#phone').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});$('#phone').addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-sy;if(dy < -45){if(current==='lock')show('passcode');else if(current==='passcode'&&pin===PASS)show('home')}},{passive:true});

const meAv=(z=48)=>`<svg class="wa" width="${z}" height="${z}" viewBox="0 0 100 100"><rect width="100" height="100" rx="10" fill="#b9c6d3"/><circle cx="50" cy="46" r="24" fill="#7b8794"/><path d="M14 100c0-22 16-30 36-30s36 8 36 30z" fill="#7b8794"/><rect x="20" y="38" width="60" height="17" rx="5" fill="#6bff2e"/><path d="M24 43h52M24 49h52" stroke="#2a3a1a" stroke-width="2"/></svg>`;
const IC={chat:'<path d="M12 4C7.6 4 4 7 4 10.8c0 2.2 1.2 4.1 3.1 5.4L6.5 19.5l3.3-1.8c.7.2 1.4.2 2.2.2 4.4 0 8-3 8-6.9S16.4 4 12 4z"/>',contacts:'<circle cx="10" cy="8" r="3.6"/><path d="M3.5 20c0-4 3-6.2 6.5-6.2s6.5 2.2 6.5 6.2zM18 11h3M18 14h3"/>',discover:'<circle cx="12" cy="12" r="8.5"/><path class="nd" d="M15.5 8.5l-2 5-5 2 2-5z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7z"/>'};
const tIc=(k,on)=>`<svg viewBox="0 0 24 24" width="30" height="30" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${IC[k]}</svg>`;
const PER='<svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7z"/></svg>';
const unread=()=>WX.reduce((a,f)=>a+f[4],0);
function wxBuild(){$('#appcontent').innerHTML='<div class="wxmain"><div class="wxhead" id="wxhead"></div><div class="wxbody" id="wxbody"></div><div class="idx" id="idx">'+'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').map(c=>'<i>'+c+'</i>').join('')+'</div><div class="wxtabs" id="wxtabs"></div></div><div class="wxpage hidden" id="wxchat"></div><div class="wxpage hidden" id="wxmom"></div>'}
function wxOpen(){if(!wxBuilt){wxBuild();wxBuilt=true}wxTab=0;wxChat=-1;$('#wxchat').classList.add('hidden');$('#wxmom').classList.add('hidden');wxRender()}
const crow=i=>`<div class="crow" onclick="wxOpenChat(${i})"><div class="avw">${av(i,50)}${WX[i][4]?'<em class="bd">'+WX[i][4]+'</em>':''}</div><div class="cinfo"><b>${WX[i][0]}</b><span>${esc(WX[i][2])}</span></div><time>${WX[i][3]}</time></div>`;
const TOP=[['#fa9d3b','新的朋友'],['#fa9d3b','仅聊天的朋友'],['#07c160','群聊'],['#1485ee','标签'],['#1485ee','公众号'],['#10aeff','服务号'],['#2782d7','企业微信联系人']];
const SORT=[[8,'B'],[11,'C'],[2,'C'],[10,'F'],[3,'G'],[5,'L'],[1,'L'],[4,'L'],[9,'X'],[7,'X'],[6,'X'],[0,'Z']];
const row=(c,l,f)=>`<div class="drow" onclick="${f||'na()'}"><i class="di" style="border-color:${c}"></i><b>${l}</b><span class="chev">›</span></div>`;
function wxRender(){
 const h=$('#wxhead'),b=$('#wxbody');h.style.display=wxTab===3?'none':'flex';$('#idx').style.display=wxTab===1?'block':'none';
 h.innerHTML=['<span class="hl" onclick="na()">☆</span>微信<span class="hr" onclick="na()">⊕</span>','通讯录<span class="hr" onclick="na()">⊕</span>','发现',''][wxTab];
 if(wxTab===0)b.innerHTML='<div class="wxs"><input placeholder="搜索" oninput="$(\'#clist\').innerHTML=order.filter(i=>WX[i][0].includes(this.value)).map(crow).join(\'\')"></div><div id="clist">'+order.map(crow).join('')+'</div>';
 if(wxTab===1){let last='';b.innerHTML='<div class="wxs"><input placeholder="搜索"></div>'+TOP.map(([c,l])=>`<div class="krow" onclick="${l==='群聊'?'wxGroups()':'na()'}"><i class="ki" style="background:${c}">${PER}</i><b>${l}</b></div>`).join('')+SORT.map(([i,L])=>{let hd=L!==last?`<div class="kh">${L}</div>`:'';last=L;return hd+`<div class="krow" onclick="wxOpenChat(${i})">${av(i,40)}<b>${WX[i][0]}</b></div>`}).join('')+'<div class="kf">12 位联系人</div>'}
 if(wxTab===2)b.innerHTML=[[['朋友圈','#4a90e2','wxMoments()']],[['视频号','#f0a030'],['直播','#ee6a50']],[['扫一扫','#3b86e8'],['听一听','#e2555a']],[['看一看','#f4b53a'],['搜一搜','#e2555a']],[['附近','#3b86e8']],[['游戏','#e8744a']],[['小程序','#6a6ae6']]].map(g=>'<div class="dg">'+g.map(([l,c,f])=>row(c,l,f)).join('')+'</div>').join('');
 if(wxTab===3)b.innerHTML=`<div class="mep">${meAv(88)}<div class="mei"><b>Summer🌙</b><span>微信号：Jiangxy0125</span><u>＋ 状态</u></div><span class="chev">›</span></div><div class="dg">${row('#07c160','服务')}</div><div class="dg">${row('#f0a030','收藏')+row('#4a90e2','朋友圈','wxMoments()')+row('#3b86e8','作品')+row('#ee6a50','卡包')+row('#f4b53a','表情')}</div><div class="dg">${row('#3b86e8','设置')}</div>`;
 $('#wxtabs').innerHTML=['chat','contacts','discover','me'].map((k,i)=>`<button class="${wxTab===i?'on':''}" onclick="wxTab=${i};wxRender()">${tIc(k,wxTab===i)}<span>${['微信','通讯录','发现','我'][i]}</span>${i===0&&unread()?'<em class="bd t">'+unread()+'</em>':''}${i===2?'<em class="d2"></em>':''}</button>`).join('');
}
function wxOpenChat(i){wxChat=i;WX[i][4]=0;const el=$('#wxchat');el.classList.remove('hidden');el.innerHTML=`<div class="chead"><button onclick="wxBack()">‹</button>${WX[i][0]}${WX[i][7]?'('+WX[i][7].cnt+')':''}<span>···</span></div><div class="cmsgs" id="cmsgs"></div><div class="cbar"><span class="ci">◖</span><input id="cin" onkeydown="if(event.key==='Enter')wxSend()" oninput="$('#csend').className=this.value?'ci s':'ci';$('#csend').textContent=this.value?'发送':'＋'"><span class="ci">☺</span><span class="ci" id="csend" onclick="wxSend()">＋</span></div>`;wxMsgs()}
function wxBack(){$('#wxchat').classList.add('hidden');wxChat=-1;wxRender()}
function wxMsgs(){const i=wxChat,el=$('#cmsgs');if(i<0||!el)return;el.innerHTML='<div class="mt">'+WX[i][3]+'</div>'+msgs[i].map(x=>x.m?`<div class="mr me">${meAv(40)}<div class="bub g">${esc(x.t)}</div></div>`:x.nm!==undefined?`<div class="mr">${sav(x)}<div class="gcol"><small>${esc(x.nm)}</small><div class="bub">${esc(x.t)}</div></div></div>`:`<div class="mr">${av(i,40)}<div class="bub">${esc(x.t)}</div></div>`).join('');el.scrollTop=el.scrollHeight}
function wxSend(){const inp=$('#cin'),v=inp.value.trim();if(!v)return;const i=wxChat;msgs[i].push({m:1,t:v});WX[i][2]=v;WX[i][3]=hm();order=[i,...order.filter(x=>x!==i)];inp.value='';$('#csend').className='ci';$('#csend').textContent='＋';wxMsgs();setTimeout(()=>{const r=RP[Math.floor(Math.random()*RP.length)];const g=WX[i][7]?msgs[i].filter(x=>x.nm!==undefined):[],sd=g.length?g[Math.floor(Math.random()*g.length)]:null;msgs[i].push(sd?{m:0,t:r,f:sd.f,nm:sd.nm}:{m:0,t:r});WX[i][2]=sd?sd.nm+'：'+r:r;WX[i][3]=hm();if(wxChat===i)wxMsgs();else{WX[i][4]++;if(wxChat<0)wxRender()}},1000)}
const PO=[[10,'今天看了一场画展，黑白之间很有力量。',1,'3小时前',['周扬']],[0,'今天的夕阳太好看了，忍不住拍下来～',3,'2小时前',['李娜','迟小烨']],[1,'新买的咖啡杯到啦，颜值超高 ☕',1,'昨天',['谢逸舟']],[2,'周末爬山打卡，累但是开心！',4,'昨天',['周扬','林清源','爸爸']],[3,'终于把这周的事情做完了，睡觉！',0,'星期六',[]],[8,'天气转凉了，大家注意保暖。',0,'星期五',['肖阿姨']],[6,'晚饭自己做的，味道还不错',2,'星期四',['李浩宇']]];
const likes=PO.map(p=>p[4].slice());
const TILE=['linear-gradient(135deg,#f6a35e,#f2677a)','linear-gradient(135deg,#7ec8e3,#4a7fd1)','linear-gradient(135deg,#a8e063,#56ab2f)','linear-gradient(135deg,#f9d976,#f39f86)'];
function wxMoments(){const el=$('#wxmom');el.classList.remove('hidden');el.innerHTML=`<div class="mback"><button onclick="$('#wxmom').classList.add('hidden')">‹</button><span onclick="na()">◎</span></div><div class="mscroll"><div class="mcover"><div class="mnm">Summer🌙</div>${meAv(64)}</div>`+PO.map((p,k)=>{const n=p[2],im=n===1?`<div class="mi1" style="background:${TILE[k%4]}"></div>`:n?'<div class="mig">'+Array.from({length:n},(_,j)=>`<div style="background:${TILE[(k+j)%4]}"></div>`).join('')+'</div>':'';const my=likes[k].includes('Summer🌙');return `<div class="mp">${av(p[0],42)}<div class="mb"><b>${WX[p[0]][0]}</b><p>${p[1]}</p>${im}<div class="mm"><time>${p[3]}</time><button onclick="wxLike(${k})">${my?'♥ 已赞':'♡ 赞'}</button></div>${likes[k].length?'<div class="ml">♡ '+likes[k].join('，')+'</div>':''}</div></div>`}).join('')+'</div>'}
function wxLike(k){const sc=$('.mscroll').scrollTop,L=likes[k],x=L.indexOf('Summer🌙');x<0?L.push('Summer🌙'):L.splice(x,1);wxMoments();$('.mscroll').scrollTop=sc}

function wxGroups(){const el=$('#wxchat');el.classList.remove('hidden');el.innerHTML='<div class="chead"><button onclick="wxBack()">‹</button>群聊</div><div class="cmsgs" style="padding:0;background:#fff">'+[12,13,14].map(crow).join('')+'</div>'}
</script></body></html>
