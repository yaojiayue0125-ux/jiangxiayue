<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iPhone · Interactive Simulator</title>
<style>
:root{--glass:rgba(255,255,255,.2);--text:#fff}*{box-sizing:border-box}body{margin:0;background:#101411;color:white;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100svh;overflow:hidden}
.phone{position:relative;width:min(100vw,430px);height:min(100svh,932px);min-height:600px;aspect-ratio:430/932;overflow:hidden;border-radius:42px;background:linear-gradient(150deg,#9dbb70,#3f6c35 48%,#102c1b);box-shadow:0 0 0 8px #202220,0 20px 70px #0009}
.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#d4e8a5 0,transparent 34%),radial-gradient(ellipse at 85% 37%,#8bbf65 0,transparent 32%),radial-gradient(ellipse at 15% 75%,#b5d37b 0,transparent 25%),linear-gradient(150deg,#a9ca7b,#547f43 42%,#173d27 85%);filter:saturate(1.15)}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 40%,#ffffff0a 41%,transparent 43%),radial-gradient(ellipse at 70% 90%,#e0e9b0aa,transparent 24%);backdrop-filter:blur(0px)}
.status{position:absolute;top:20px;left:27px;right:27px;height:35px;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:650;z-index:20}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:150px;height:38px;border-radius:30px;background:#000;z-index:21;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;gap:4px}.island span{width:3px;height:3px;background:#44505b;border-radius:50%}.battery{border:1.5px solid white;border-radius:5px;padding:1px 4px;font-size:12px;margin-left:4px}
.screen{position:absolute;inset:0;z-index:3;transition:opacity .25s,transform .25s}.hidden{display:none!important}.lock{display:flex;flex-direction:column;align-items:center;padding-top:90px;background:linear-gradient(160deg,#a4c879dd,#5d8a4dcc 48%,#163d28dd)}.lock .date{font-size:18px;font-weight:500;margin-top:26px}.lock .bigtime{font-size:86px;letter-spacing:-4px;font-weight:250;line-height:1.08}.lock .lockhint{position:absolute;bottom:92px;font-size:14px;opacity:.9}.lock .lockbottom{position:absolute;bottom:28px;left:30px;right:30px;display:flex;justify-content:space-between}.circlebtn{width:46px;height:46px;border-radius:50%;background:#0004;border:1px solid #ffffff55;display:grid;place-items:center;font-size:20px}
.passcode{background:linear-gradient(155deg,#789d56,#244e34 65%,#102a1c);display:flex;flex-direction:column;align-items:center;padding-top:100px}.passcode .prompt{font-size:20px;margin-bottom:24px}.dots{display:flex;gap:17px;margin-bottom:30px}.dot{width:10px;height:10px;border:1px solid white;border-radius:50%}.dot.filled{background:white}.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:13px 17px}.key{width:68px;height:68px;border-radius:50%;border:0;background:#ffffff22;color:white;font-size:27px;font-weight:300;backdrop-filter:blur(12px)}.key small{display:block;font-size:8px;letter-spacing:1px;margin-top:1px}.passfoot{position:absolute;bottom:35px;left:35px;right:35px;display:flex;justify-content:space-between;font-size:14px}
.home{padding:80px 25px 20px;background:transparent}.widgets{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:28px}.widget{height:165px;border-radius:26px;background:#ffffffb8;color:#fff;text-shadow:0 1px 3px #3346;backdrop-filter:blur(20px);padding:14px;position:relative;overflow:hidden;box-shadow:inset 0 1px #ffffff80}.weather .loc{font-size:12px}.weather .temp{font-size:46px;font-weight:250;margin:15px 0 3px}.weather .desc{font-size:16px}.weather .low{font-size:12px;margin-top:8px}.music{background:linear-gradient(145deg,#f8f8f8ee,#d8e1d7dd);color:#5b635c;text-shadow:none}.vinyl{position:absolute;right:-14px;top:-18px;width:120px;height:120px;border-radius:50%;background:repeating-radial-gradient(circle,#f7f7f7 0 3px,#d7dcd9 4px 5px);display:grid;place-items:center}.vinyl:after{content:"♪";width:70px;height:70px;border-radius:50%;background:linear-gradient(140deg,#314e45,#a6c3ae);display:grid;place-items:center;color:white;font-size:30px}.music .m-title{position:absolute;bottom:35px;left:14px;font-size:15px;font-weight:600}.music .m-sub{position:absolute;bottom:14px;left:14px;font-size:12px}.music .heart{position:absolute;right:14px;bottom:12px;font-size:23px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 12px}.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;border:0;background:none;color:white;padding:0;font:inherit;cursor:pointer}.iconbox{width:min(19vw,70px);height:min(19vw,70px);max-width:70px;max-height:70px;border-radius:19px;display:grid;place-items:center;font-size:34px;box-shadow:inset 0 1px 2px #ffffff8a,0 4px 8px #0002;overflow:hidden}.app label{font-size:12px;text-shadow:0 1px 3px #0008;white-space:nowrap}.badge{position:absolute;top:-6px;right:2px;background:#ff3045;color:white;border-radius:20px;min-width:26px;height:26px;padding:3px 6px;font-size:13px;display:grid;place-items:center;border:1px solid #ffffff40}.rednote{background:#ff2449;font-weight:800;font-size:19px}.weibo{background:linear-gradient(#ffe76a,#f6bb2e);color:#bd101a}.ding{background:#1684f9;color:white}.insta{background:linear-gradient(135deg,#713be9,#f4267b,#ffb52e);font-size:39px}.qq{background:linear-gradient(145deg,#fff,#dce6e1);color:#e5c500}.safari{background:linear-gradient(145deg,#fff,#dce8ff);color:#1688ee}.tf{background:#fff;color:#f2a51b;font-weight:900;font-style:italic}.xapp{background:#050505;color:white}.phoneapp{background:#23d45b}.msgapp{background:#27d85f}.camera{background:linear-gradient(145deg,#eee,#aaa);color:#25282d}.wechat{background:#14c86a}.appglyph{font-size:33px}.searchpill{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);background:#ffffff38;border:1px solid #ffffff70;border-radius:22px;padding:7px 15px;font-size:12px;backdrop-filter:blur(10px)}.dock{position:absolute;bottom:18px;left:20px;right:20px;height:91px;border-radius:30px;background:#ffffff35;border:1px solid #ffffff45;backdrop-filter:blur(25px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 10px;gap:10px}.dock .iconbox{width:min(17vw,65px);height:min(17vw,65px);border-radius:17px}
.appview{background:#f4f5f8;color:#16171a;padding:58px 20px 25px;overflow:auto}.appbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{border:0;background:none;color:#2584ff;font-size:16px;padding:0}.apptitle{font-size:25px;font-weight:750}.searchinput{width:100%;border:0;border-radius:12px;background:#e5e6ea;padding:12px;font-size:15px;margin:8px 0 16px;outline:none}.panel{background:white;border-radius:16px;padding:15px;margin-bottom:12px}.muted{color:#7a7d84;font-size:13px}.rowitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.rowitem:last-child{border:0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#dce8dc;font-size:20px}.rowitem .grow{flex:1}.bluebtn{background:#1684ff;color:white;border:0;border-radius:12px;padding:12px 16px;font-size:15px;width:100%;margin-top:10px}.notearea{width:100%;min-height:250px;border:0;outline:none;resize:vertical;font:16px/1.6 inherit;background:transparent}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.calc button{border:0;border-radius:50%;aspect-ratio:1;background:#ddd;font-size:23px}.calc button.op{background:#ff9f0a;color:white}.calcresult{font-size:48px;text-align:right;padding:25px 4px}.settingsrow{padding:15px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.switch{accent-color:#35c759}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:8px;background:#ffffffdd;z-index:40;cursor:pointer}.toast{position:absolute;top:55px;left:20px;right:20px;padding:12px 16px;background:#202020d9;border-radius:15px;z-index:50;font-size:13px;backdrop-filter:blur(12px);display:none}
@media(min-width:500px){.phone{height:min(94svh,932px)}}
</style></head>
<body><main class="phone" id="phone">
<div class="wallpaper"></div>
<div class="status"><span id="clock">23:59</span><span style="margin-left:auto;margin-right:165px"></span><span>▮▮▮ <span class="battery">74</span></span></div><div class="island"><span></span><span></span><span></span><span></span><span></span></div>
<section class="screen lock" id="lock"><div class="date" id="date">星期日，10月25日</div><div class="bigtime" id="bigtime">23:59</div><div class="lockhint">轻点屏幕或向上滑动以解锁</div><div class="lockbottom"><div class="circlebtn">◉</div><div class="circlebtn">⌁</div></div></section>
<section class="screen passcode hidden" id="passcode"><div class="prompt">输入密码</div><div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="keypad" id="keypad"></div><div class="passfoot"><span id="cancel">取消</span><span id="delete">删除</span></div></section>
<section class="screen home hidden" id="home">
<div class="widgets"><div class="widget weather"><div class="loc">⌖ Chaoyang District</div><div class="temp">☀ 13°</div><div class="desc">Fog</div><div class="low">17/11°C　🟠 Mild</div></div><div class="widget music"><div class="vinyl"></div><div class="m-title">好天气</div><div class="m-sub">韦礼安 · 已暂停</div><div class="heart" id="heart">♡</div></div></div>
<div class="apps">
<button class="app" data-app="小红书"><span class="iconbox rednote">小红书</span><label>rednote</label></button>
<button class="app" data-app="微博"><span class="iconbox weibo">◉</span><label>Weibo</label><span class="badge">3</span></button>
<button class="app" data-app="钉钉"><span class="iconbox ding">➤</span><label>DingDing</label></button>
<button class="app" data-app="Instagram"><span class="iconbox insta">◎</span><label>Instagram</label></button>
<button class="app" data-app="QQ音乐"><span class="iconbox qq">♫</span><label>QQMusic</label></button>
<button class="app" data-app="Safari"><span class="iconbox safari">🧭</span><label>Safari</label></button>
<button class="app" data-app="T-FAMILY"><span class="iconbox tf">TF</span><label>T-FAMILY</label></button>
<button class="app" data-app="X"><span class="iconbox xapp">𝕏</span><label>X</label><span class="badge">10</span></button>
</div>
<div class="searchpill" id="search">⌕ Search</div>
<div class="dock">
<button class="app" data-app="电话"><span class="iconbox phoneapp">☎</span></button>
<button class="app" data-app="信息"><span class="iconbox msgapp">▰</span><span class="badge">1,221</span></button>
<button class="app" data-app="相机"><span class="iconbox camera">📷</span></button>
<button class="app" data-app="微信"><span class="iconbox wechat">●</span></button>
</div></section>
<section class="screen appview hidden" id="appview"><div class="appbar"><button class="back" id="back">‹ 返回</button><div class="apptitle" id="apptitle">信息</div></div><div id="appcontent"></div></section>
<div class="toast" id="toast"></div><div class="homebar" id="homebar"></div></main>
<script>
const $=s=>document.querySelector(s);let current='lock',pin='',activeApp='',liked=false;
function show(id){['lock','passcode','home','appview'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));current=id}
function updateTime(){let d=new Date();let t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#clock').textContent=t;$('#bigtime').textContent=t;$('#date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
updateTime();setInterval(updateTime,15000);
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
$('#lock').addEventListener('click',()=>show('passcode'));$('#lock').addEventListener('touchstart',()=>{}, {passive:true});
const keypad=$('#keypad');['1','2','3','4','5','6','7','8','9','取消','0','⌫'].forEach(k=>{let b=document.createElement('button');b.className='key';b.textContent=k;if(k==='取消'||k==='⌫')b.style.fontSize='14px';b.onclick=()=>{if(k==='取消'){show('lock');pin=''}else if(k==='⌫'){pin=pin.slice(0,-1)}else if(pin.length<4){pin+=k;if(pin.length===4){if(pin==='0125'){show('home');pin='';toast('欢迎回来')}else{toast('密码错误，请重试');pin=''}}}renderDots()};keypad.appendChild(b)});
function renderDots(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('filled',i<pin.length))}
$('#cancel').onclick=()=>{pin='';renderDots();show('lock')};$('#delete').onclick=()=>{pin=pin.slice(0,-1);renderDots()};
$('#homebar').onclick=()=>{if(current==='lock'){show('passcode')}else if(current==='passcode'){show('lock')}else show('home')};
$('#heart').onclick=()=>{liked=!liked;$('#heart').textContent=liked?'♥':'♡';$('#heart').style.color=liked?'#f44':'white';toast(liked?'已添加到喜欢':'已取消喜欢')};
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function openApp(name){activeApp=name;$('#apptitle').textContent=name;show('appview');const c=$('#appcontent');c.innerHTML='';
const panel=(inner)=>{let d=document.createElement('div');d.className='panel';d.innerHTML=inner;c.appendChild(d)};
const row=(icon,title,sub='')=>`<div class="rowitem"><div class="avatar">${icon}</div><div class="grow"><strong>${title}</strong><div class="muted">${sub}</div></div><span style="color:#bbb">›</span></div>`;
if(name==='信息'||name==='微信'){panel(`<input class="searchinput" placeholder="搜索"><div>${row('🌿','妈妈','到家告诉我一声。')}${row('🐰','特别关注','刚刚发来一条消息')}${row('💬','舞社群聊','周末排练时间确认一下')}${row('✨','置顶聊天','今天过得怎么样？')}</div><button class="bluebtn" onclick="toast('新建对话已打开')">＋ 新建信息</button>`)}
else if(name==='电话'){panel(`<div style="font-size:32px;text-align:center;padding:18px">个人收藏</div>${row('👩','妈妈','移动电话')}${row('🌼','舞社','最近通话 · 今天')}`);panel(`<div style="font-size:14px;margin-bottom:12px">拨号键盘</div><div class="calc" id="dial"></div><div id="dialnum" style="text-align:center;font-size:24px;margin:12px"></div><button class="bluebtn" onclick="toast('模拟拨号中…')">呼叫</button>`);let d=$('#dial');'123456789*0#'.split('').forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>$('#dialnum').textContent+ n;d.appendChild(b)})}
else if(name==='相机'){panel(`<div style="height:340px;border-radius:16px;background:linear-gradient(135deg,#171b1e,#525a60);display:grid;place-items:center;color:#ddd;font-size:14px">相机模拟预览</div><div style="display:flex;justify-content:center;padding:20px"><button class="circlebtn" style="background:white;color:#333;width:60px;height:60px" onclick="toast('咔嚓！照片已拍摄')">●</button></div>`)}
else if(name==='备忘录'){panel(`<input class="searchinput" placeholder="标题"><textarea class="notearea" placeholder="开始记录你的想法……"></textarea><button class="bluebtn" onclick="toast('备忘录已保存')">完成</button>`)}
else if(name==='计算器'){panel(`<div class="calcresult" id="calcresult">0</div><div class="calc" id="calculator"></div>`);let expr='';['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''].filter(Boolean).forEach(n=>{let b=document.createElement('button');b.textContent=n;if(['÷','×','−','+','='].includes(n))b.className='op';b.onclick=()=>{let r=$('#calcresult');if(n==='AC'){expr='';r.textContent='0'}else if(n==='='){try{r.textContent=String(Function('return '+expr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))());expr=r.textContent}catch{r.textContent='错误';expr=''}}else{expr+=({'×':'*','÷':'/','−':'-'}[n]||n);r.textContent=expr}};$('#calculator').appendChild(b)})}
else if(name==='设置'){panel(`${row('✈️','飞行模式','关闭')}${row('◉','Wi-Fi','已连接')}${row('▰','蓝牙','已打开')}${row('🌿','墙纸','绿色渐变')}${row('🔒','密码','已设置')}`);panel(`<div class="settingsrow">深色模式 <input class="switch" type="checkbox" onchange="document.body.style.background=this.checked?'#050505':'#101411'"></div><div class="settingsrow">电量百分比 <span>74%</span></div>`)}
else if(name==='Safari'){panel(`<input class="searchinput" id="webq" placeholder="搜索或输入网站名称"><button class="bluebtn" onclick="let q=$('#webq').value;toast(q?'模拟打开：'+q:'请输入网址')">前往</button>`);panel(`<strong>个人收藏</strong>${row('🔎','搜索','搜索网页')}${row('🌐','常用网站','你收藏的网站会显示在这里')}`)}
else if(name==='QQ音乐'){panel(`<div style="text-align:center;padding:20px"><div style="font-size:65px">♫</div><h2>好天气</h2><div class="muted">韦礼安</div><input type="range" min="0" max="100" value="35" style="width:100%;margin:25px 0"><div style="font-size:25px;display:flex;justify-content:center;gap:35px"><span onclick="toast('上一首')">⏮</span><span onclick="toast('播放状态已切换')">▶︎ / Ⅱ</span><span onclick="toast('下一首')">⏭</span></div></div>`)}
else if(name==='小红书'||name==='微博'||name==='Instagram'||name==='X'){panel(`<input class="searchinput" placeholder="搜索"><h3>${name==='小红书'?'发现生活里的美好':name==='微博'?'微博热搜':'为你推荐'}</h3>${row('🌱','今日份绿色','把平凡的日子过得闪闪发光。')}${row('📸','夏日记录','收藏一点好天气。')}${row('🎧','最近在听','循环播放的歌和心情。')}<button class="bluebtn" onclick="toast('已刷新内容')">刷新动态</button>`)}
else if(name==='T-FAMILY'){panel(`<div style="text-align:center;padding:25px"><div style="font-size:55px;color:#f2a51b;font-weight:900">TF</div><h2>T-FAMILY</h2><p class="muted">记录喜欢的舞台与日常</p></div>${row('🎤','最新动态','查看关注的艺人')}${row('📷','相册','收藏的照片')}</div>`)}
else if(name==='钉钉'){panel(`${row('📌','工作通知','暂无未读通知')}${row('🗓️','日程','今天没有安排')}`)}
else{panel(`<div style="text-align:center;padding:25px"><div style="font-size:50px">📱</div><h2>${name}</h2><p class="muted">这是一个可交互的模拟 App 页面。</p><button class="bluebtn" onclick="toast('操作成功')">打开功能</button></div>`)}
}
$('#back').onclick=()=>show('home');$('#search').onclick=()=>openApp('Safari');
document.addEventListener('keydown',e=>{if(current==='passcode'&&/^\d$/.test(e.key)&&pin.length<4){pin+=e.key;if(pin.length===4){if(pin==='0125'){show('home');pin=''}else{toast('密码错误');pin=''}}renderDots()}if(e.key==='Escape')show('home')});
let sy=0;$('#phone').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});$('#phone').addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-sy;if(dy < -45){if(current==='lock')show('passcode');else if(current==='passcode'&&pin==='0125')show('home')}if(dy>55&&current==='appview')show('home')},{passive:true});
</script></body></html>
